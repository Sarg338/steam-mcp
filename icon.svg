<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>steam-mcp</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2037"/>
      <stop offset="1" stop-color="#1B4270"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#5FB8FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5FB8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F9FF"/>
      <stop offset="1" stop-color="#C9DEF4"/>
    </linearGradient>
    <linearGradient id="wisp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7FD6FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#7FD6FF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#030B16" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="6"/>

  <!-- rising steam -->
  <g fill="none" stroke="url(#wisp)" stroke-width="20" stroke-linecap="round">
    <path d="M196 232 C 176 206, 216 186, 196 158 C 182 138, 206 122, 198 104"/>
    <path d="M256 226 C 234 196, 278 172, 256 138 C 240 114, 268 96, 258 74"/>
    <path d="M316 232 C 296 206, 336 186, 316 158 C 302 138, 326 122, 318 104"/>
  </g>

  <!-- controller -->
  <g filter="url(#shadow)">
    <path fill="url(#pad)" d="
      M 176 262
      L 336 262
      C 382 262, 408 290, 420 336
      L 434 392
      C 442 424, 422 446, 396 446
      C 374 446, 360 432, 348 410
      L 334 384
      L 178 384
      L 164 410
      C 152 432, 138 446, 116 446
      C 90 446, 70 424, 78 392
      L 92 336
      C 104 290, 130 262, 176 262 Z"/>
  </g>

  <!-- d-pad -->
  <g fill="#1B4270">
    <rect x="160" y="298" width="22" height="66" rx="6"/>
    <rect x="138" y="320" width="66" height="22" rx="6"/>
  </g>

  <!-- face buttons -->
  <g fill="#1B4270">
    <circle cx="352" cy="306" r="12"/>
    <circle cx="352" cy="356" r="12"/>
    <circle cx="327" cy="331" r="12"/>
  </g>
  <circle cx="377" cy="331" r="12" fill="#2E9BFF"/>

  <!-- centre detail -->
  <rect x="236" y="318" width="40" height="10" rx="5" fill="#1B4270" fill-opacity="0.55"/>
</svg>
