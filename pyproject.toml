[project]
name = "steam-mcp"
version = "1.15.0"
description = "Read-only Steam MCP server: games, reviews, sales, prices and player counts with no API key; add your own key for library, friends and achievements."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sarg" }]
keywords = ["mcp", "steam", "model-context-protocol", "llm", "valve", "gaming"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Both SDK majors are supported: v2 (spec revision 2026-07-28) and the v1.x
    # maintenance line. The floor is 1.28 because that is where the v1.x line
    # settled; there is deliberately no upper bound.
    "mcp>=1.28",
    "httpx2>=2.9",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
steam-mcp = "steam_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Sarg338/steam-mcp"
Repository = "https://github.com/Sarg338/steam-mcp"
Issues = "https://github.com/Sarg338/steam-mcp/issues"
Documentation = "https://github.com/Sarg338/steam-mcp#readme"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (F), pycodestyle (E/W), bugbear (B), and blind-except (BLE — this is
# the rule the `# noqa: BLE001` markers on the broad tool-level excepts suppress).
select = ["E", "F", "W", "B", "BLE"]
# Line length is a soft ~88 convention here, not a hard CI gate.
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steam_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/steam_mcp",
    "/tests",
    "/README.md",
    "/CHANGES.md",
    "/LICENSE",
    "/PRIVACY.md",
    "/SECURITY.md",
    "/SKILL.md",
    "/pyproject.toml",
]
